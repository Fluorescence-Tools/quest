name: QuEst Conda CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "modules/quest/**"
      - "modules/quest/.github/workflows/quest-conda.yml"
  pull_request:
    branches:
      - main
    paths:
      - "modules/quest/**"
      - "modules/quest/.github/workflows/quest-conda.yml"

jobs:
  build-and-test:
    name: Build & Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10"]

    env:
      OUT_DIR: conda-bld
      NUMBA_DISABLE_JIT: "1"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Free Disk Space (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            python=${{ matrix.python-version }}
            boa
            conda-build
            anaconda-client
            pytest
          cache-downloads: true
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: Build conda package (mambabuild)
        shell: bash -l {0}
        working-directory: modules/quest/conda-recipe
        run: |
          micromamba run -n build conda mambabuild . \
            --output-folder "${GITHUB_WORKSPACE}/${OUT_DIR}"

      - name: Index built packages
        shell: bash -l {0}
        run: |
          micromamba run -n build conda index "${GITHUB_WORKSPACE}/${OUT_DIR}"

      - name: Create test env from local channel
        shell: bash -l {0}
        run: |
          micromamba run -n build conda create -y -n test \
            -c "file://${GITHUB_WORKSPACE}/${OUT_DIR}" \
            -c conda-forge \
            python=${{ matrix.python-version }} \
            quest \
            pytest \
            click

      - name: Run tests
        shell: bash -l {0}
        working-directory: ${{ github.workspace }}
        run: |
          micromamba run -n test pytest modules/quest/tests

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quest-conda-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ env.OUT_DIR }}/**/*.tar.bz2
