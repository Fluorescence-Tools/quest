[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest"
version = "19.8.13"
description = "QuEst is a protein structure based fluorescence quenching estimator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Thomas-Otavio Peulen", email = "thomas.otavio.peulen@gmail.com" }]
dependencies = [
  "numpy",
  "numexpr",
  "numba",
  "click",
  "pyyaml",
  "pyqt5",
  "pyqtgraph",
  "pyopengl",
  "tables",
  "labellib",
  "qtpy",
  "tqdm",
]

[project.scripts]
quest = "quest.cli:cli"

[project.gui-scripts]
"cs.quest" = "quest.gui:start_gui"

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["quest*"]

[tool.setuptools.package-data]
# No `*.ui`: the Qt form is `quest/gui/quest.view.json`, rendered by ChiSurf's
# AutoForm. `*.json` therefore ships the view spec, the manifest and the
# settings; `*.ico` ships the window icon that replaced the Qt resource module.
"*" = ["*.json", "*.yaml", "*.ico", "*.png", "*.svg", "*.css", "*.so", "*.dll"]

[tool.pytest.ini_options]
markers = [
  "browser: drives the web UI in a real browser; needs both servers and its own process",
  "notebooks: executes the notebooks through nbclient; spawns kernels, so it needs its own process",
]
# Two suites are deselected by default and run by their own pixi tasks:
# `test-e2e` (browser) and `test-notebooks`.
#
# Not a convenience: Chromium's renderer dies ("Page crashed") once a single
# pytest process has also imported IMP, numba, FastAPI and executed the
# notebooks. The suite passes alone and fails at the end of a combined run, so
# leaving it in the default selection means a red suite that says nothing about
# QuEst. Deselecting is honest; silently skipping would not be.
addopts = "-m 'not browser and not notebooks'"
